<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of the Cosmos: Co-Op RPG</title>
    <!-- Stable global PeerJS CDN for instant P2P multiplayer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --primary: #a855f7;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
            border: 2px solid #1f2937;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #c084fc;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--accent); font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 2px solid var(--primary); background: rgba(0,0,0,0.4);
            color: #00ffcc; font-size: 18px; text-align: center; outline: none;
        }

        .menu-btn {
            width: 100%; padding: 15px; background: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.2s; margin-top: 10px;
            box-shadow: 0 4px 0 #7e22ce;
        }
        .menu-btn:active { transform: translateY(2px); box-shadow: none; }

        .divider { text-align: center; margin: 15px 0; color: #4b5563; }

        /* Status UI Header */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #030712; padding: 12px 20px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid #374151;
        }
        .health-container { flex: 1; margin-right: 20px; }
        .health-label { font-size: 12px; text-transform: uppercase; margin-bottom: 4px; color: var(--danger); }
        .health-bg { width: 100%; height: 14px; background: #1f2937; border-radius: 7px; overflow: hidden; }
        .health-fill { width: 100%; height: 100%; background: var(--danger); transition: width 0.4s ease; }
        
        .inventory-panel { text-align: right; }
        .inv-items { font-size: 13px; color: var(--success); font-weight: bold; }

        /* Story Terminal Viewport */
        .story-box {
            background: #020617; border: 2px solid #374151;
            padding: 20px; border-radius: 8px; min-height: 150px;
            margin-bottom: 20px; line-height: 1.6; font-size: 15px;
            color: #34d399; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Ambient Dynamic Scene Backdrop Graphic (CSS Minimalist Shape Art) */
        .scene-graphic {
            width: 100%; height: 80px; background: #1f2937;
            margin-bottom: 20px; border-radius: 8px; overflow: hidden;
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        /* Multi-choice Node Layout */
        .choice-stack { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn {
            width: 100%; padding: 14px; background: #1f2937;
            color: var(--text); border: 1px solid #4b5563; text-align: left;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            position: relative; font-size: 14px;
        }
        .choice-btn:hover { background: #374151; border-color: var(--primary); }
        .choice-btn.my-vote { border-left: 6px solid var(--primary); padding-left: 10px; }
        
        /* Voting Tokens overlay tags */
        .vote-indicator {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold;
        }
        .vote-p1 { background: #7e22ce; color: white; }
        .vote-p2 { background: #2563eb; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <!-- SCREEN 1: Peer Connection Terminal -->
        <div id="setup-screen" class="screen active">
            <h1>📡 DEEP-SPACE CO-OP RPG</h1>
            <div class="input-group">
                <label>Astronaut Callsign:</label>
                <input type="text" id="username" placeholder="Designate identity...">
            </div>
            <hr style="opacity: 0.1; margin: 20px 0;">
            <button class="menu-btn" onclick="initializeLobby(true)">Initialize Sub-Station (Host)</button>
            <div class="divider">OR</div>
            <div class="input-group">
                <label>Target Sub-Station Frequency:</label>
                <input type="text" id="room-input" placeholder="Enter frequency index...">
            </div>
            <button class="menu-btn" style="background:#2563eb; box-shadow:0 4px 0 #1d4ed8;" onclick="initializeLobby(false)">Patch into Frequency (Join)</button>
        </div>

        <!-- SCREEN 2: Transmission Hold -->
        <div id="waiting-screen" class="screen">
            <h2>Establishing Communications</h2>
            <div id="code-box" style="background:rgba(0,0,0,0.4); padding:20px; border-radius:8px; text-align:center; border:1px dashed var(--accent); margin-bottom:20px; display:none;">
                Relay this patch code to your partner node:<br><br>
                <span id="display-code" style="font-size:28px; font-weight:bold; color:var(--success); letter-spacing:2px;">---</span>
            </div>
            <div style="text-align:center; font-style:italic; color:#9ca3af; animation: pulse 1.5s infinite;">Awaiting biometric sync from secondary explorer...</div>
        </div>

        <!-- SCREEN 3: Interactive Narrative Engine Window -->
        <div id="game-screen" class="screen">
            <div class="status-bar">
                <div class="health-container">
                    <div class="health-label">⚡ Shared Life Support (O₂): <span id="hp-num">100</span>%</div>
                    <div class="health-bg"><div id="hp-bar" class="health-fill"></div></div>
                </div>
                <div class="inventory-panel">
                    <div style="font-size:10px; color:#9ca3af; text-transform:uppercase;">Shared Cargo Inventory</div>
                    <div id="inventory-list" class="inv-items">Empty</div>
                </div>
            </div>

            <!-- Visual Graphic Indicator -->
            <div id="graphic-backdrop" class="scene-graphic"></div>

            <!-- Master Text Node Injected Here -->
            <div id="story-body" class="story-box"></div>

            <!-- Choice Stack Dynamic Render Canvas -->
            <div id="choices-box" class="choice-stack"></div>
        </div>
    </div>

    <script>
        let peer = null, connection = null;
        let isHost = false;
        let myName = "", oppName = "Partner";
        
        // Shared State Array Structure
        let gameState = {
            currentScene: "intro",
            oxygen: 100,
            inventory: [],
            p1Vote: null,
            p2Vote: null
        };

        // Master Story Database (Single Structure Layout Model)
        const storyTree = {
            intro: {
                text: "CRASH SIGHT. Warning alarms echo inside your helmets. Your landing capsule has torn open on a jagged neon-purple mountain plain. Oxygen filters are venting into the atmosphere. You must move quickly.",
                graphic: "radial-gradient(circle, #7e22ce 10%, #030712 90%)",
                choices: [
                    { text: "Scavenge the fiery hull wreckage for equipment.", next: "scavenge" },
                    { text: "March immediately toward the glowing valley base.", next: "valley" }
                ]
            },
            scavenge: {
                text: "The hull plates are blazing hot, but your combined efforts allow you to pull open an intact survival chest. Inside, you salvage a high-grade Plasma Torch! However, inhaling the toxic localized smoke costs the crew 15% Oxygen.",
                graphic: "linear-gradient(0deg, #ef4444 0%, #020617 80%)",
                item: "Plasma Torch",
                damage: 15,
                choices: [
                    { text: "With tool in hand, proceed down to the low valley.", next: "valley" }
                ]
            },
            valley: {
                text: "You reach the low basin. A giant sealed blast door blocks the mountain pass. It appears to belong to an abandoned drilling facility. Heavy high-voltage power lines hang loose nearby, crackling with raw electricity.",
                graphic: "linear-gradient(90deg, #1f2937, #111827)",
                choices: [
                    { text: "Attempt to override the door panel with the Plasma Torch.", next: "door_torch", requiresItem: "Plasma Torch" },
                    { text: "Grab the exposed live power lines to jumpstart the console.", next: "door_shock" },
                    { text: "Search for a weak ventilation shaft around the perimeter.", next: "vent_route" }
                ]
            },
            door_torch: {
                text: "SUCCESS! You ignite the Plasma Torch and cut directly through the door lock gears. The blast doors grind open effortlessly, revealing a clean shortcut path to an operational landing bay. You have escaped safely! VICTORY.",
                graphic: "radial-gradient(circle, #10b981 20%, #020617 100%)",
                choices: [] // Terminal leaf endpoint
            },
            door_shock: {
                text: "The moment both your spacesuits contact the exposed line, a violent thermal surge loops through your main life-support arrays. The doors click open, but the catastrophic feedback loops drains 50% Oxygen instantly.",
                graphic: "linear-gradient(135deg, #eab308, #000)",
                damage: 50,
                choices: [
                    { text: "Stumble through the open doorway before you collapse.", next: "landing_bay" }
                ]
            },
            vent_route: {
                text: "You crawl inside the cramped metal ventilation shafts. Halfway through, a massive automated filtration fan turns on! It begins pulling your bodies toward the blades. You need a structural block.",
                graphic: "repeating-linear-gradient(45deg, #374151, #1f2937 40px)",
                choices: [
                    { text: "Jam the Plasma Torch into the fan drive shaft assembly.", next: "fan_jam_torch", requiresItem: "Plasma Torch" },
                    { text: "Brace together tightly and attempt to push against the airflow.", next: "fan_fail" }
                ]
            },
            fan_jam_torch: {
                text: "The metal teeth grind against your durable salvage tool! The fan sparks, stops spinning, and explodes out backward. You crawl safely out of the structural exit and drop directly down into the clean landing bay. VICTORY.",
                graphic: "radial-gradient(circle, #10b981 20%, #020617 100%)",
                choices: []
            },
            fan_fail: {
                text: "The wind pressure is too overwhelming for human force alone. You are tumbled down the chute, fracturing your secondary chest units. You lose 40% Oxygen before slipping out into the hangar deck.",
                graphic: "linear-gradient(180deg, #ef4444, #000)",
                damage: 40,
                choices: [
                    { text: "Drag your bodies onto the hangar flight deck.", next: "landing_bay" }
                ]
            },
            landing_bay: {
                text: "You step out into a pristine automated landing bay. An active scout cruiser sits warmed up on the center pad, its boarding ramp extended. You have successfully bypassed the deadly lunar storms! VICTORY.",
                graphic: "radial-gradient(circle, #06b6d4 10%, #111827 90%)",
                choices: []
            },
            dead: {
                text: "CRITICAL FAIL. Your life support readings flatline into zeros. The harsh atmosphere of the moon breaches your suits as your systems run completely cold. MISSION FAILED.",
                graphic: "solid #000",
                choices: []
            }
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Multiplayer Network Initialization
        function initializeLobby(hostFlag) {
            isHost = hostFlag;
            myName = document.getElementById('username').value.trim() || (isHost ? "Explorer A" : "Explorer B");
            showScreen('waiting-screen');

            if(isHost) {
                const code = Math.floor(1000 + Math.random() * 9000);
                peer = new Peer(`space-${code}`);
                peer.on('open', (id) => {
                    document.getElementById('code-box').style.display = 'block';
                    document.getElementById('display-code').textContent = id;
                });
                peer.on('connection', (conn) => {
                    connection = conn;
                    setupNetworkHooks();
                });
            } else {
                const targetCode = document.getElementById('room-input').value.trim();
                if(!targetCode) return alert("Frequency code mandatory!");
                peer = new Peer();
                peer.on('open', () => {
                    connection = peer.connect(targetCode);
                    setupNetworkHooks();
                });
            }
        }

        function setupNetworkHooks() {
            connection.on('open', () => {
                connection.send({ type: 'HANDSHAKE', name: myName });
            });

            connection.on('data', (data) => {
                if(data.type === 'HANDSHAKE') {
                    oppName = data.name;
                    showScreen('game-screen');
                    renderCurrentSceneNode();
                } else if(data.type === 'VOTE_CAST') {
                    if(isHost) {
                        gameState.p2Vote = data.index;
                        evaluateVoteResolution();
                    } else {
                        // Guest mirror layout display update
                        updateVisualVoteMarkers(data.p1Index, data.p2Index);
                    }
                } else if(data.type === 'STATE_SYNC') {
                    gameState = data.state;
                    renderCurrentSceneNode();
                }
            });
        }

        // Master Layout Injection Function ("No-Repeat" Trick)
        function renderCurrentSceneNode() {
            const node = storyTree[gameState.currentScene];
            
            // 1. Process damage updates if newly applied to state
            document.getElementById('hp-num').textContent = gameState.oxygen;
            document.getElementById('hp-bar').style.width = `${gameState.oxygen}%`;

            // 2. Render Shared Cargo inventory list
            document.getElementById('inventory-list').textContent = 
                gameState.inventory.length > 0 ? gameState.inventory.join(', ') : "Empty Space";

            // 3. Inject Scene Text Content and change background artwork
            document.getElementById('story-body').textContent = node.text;
            document.getElementById('graphic-backdrop').style.background = node.graphic;

            // 4. Render Dynamic Choice Button Options
            const box = document.getElementById('choices-box');
            box.innerHTML = "";

            node.choices.forEach((choice, index) => {
                // If item is required and team doesn't have it, don't show choice button
                if(choice.requiresItem && !gameState.inventory.includes(choice.requiresItem)) {
                    return;
                }

                const btn = document.createElement('button');
                btn.className = "choice-btn";
                btn.textContent = choice.text;

                // Add active tracking tags if player has clicked it
                let currentVoteIndex = isHost ? gameState.p1Vote : gameState.p2Vote;
                if(currentVoteIndex === index) {
                    btn.classList.add('my-vote');
                }

                btn.onclick = () => castChoiceVote(index);
                box.appendChild(btn);
            });

            // Mirror markers across devices
            updateVisualVoteMarkers(gameState.p1Vote, gameState.p2Vote);
        }

        function castChoiceVote(index) {
            if(isHost) {
                gameState.p1Vote = (gameState.p1Vote === index) ? null : index; // toggle
                evaluateVoteResolution();
            } else {
                connection.send({ type: 'VOTE_CAST', index: index });
            }
        }

        function evaluateVoteResolution() {
            // Host processes voting conditions and forces synchronous engine updates
            if(gameState.p1Vote !== null && gameState.p1Vote === gameState.p2Vote) {
                const node = storyTree[gameState.currentScene];
                const finalChoice = node.choices[gameState.p1Vote];

                // Advance scene pathway destination
                gameState.currentScene = finalChoice.next;
                
                // Clear active processing buffers
                gameState.p1Vote = null;
                gameState.p2Vote = null;

                // Handle item pickup modifiers
                const nextNode = storyTree[gameState.currentScene];
                if(nextNode.item && !gameState.inventory.includes(nextNode.item)) {
                    gameState.inventory.push(nextNode.item);
                }
                // Handle damage attributes
                if(nextNode.damage) {
                    gameState.oxygen = Math.max(0, gameState.oxygen - nextNode.damage);
                    if(gameState.oxygen <= 0) {
                        gameState.currentScene = "dead";
                    }
                }
            }

            // Sync structural game changes across connection
            connection.send({ type: 'STATE_SYNC', state: gameState });
            renderCurrentSceneNode();
        }

        function updateVisualVoteMarkers(p1Idx, p2Idx) {
            // Dynamically query button offsets to append real-time alignment tags
            const buttons = document.querySelectorAll('.choice-btn');
            buttons.forEach((btn, idx) => {
                // Clear out stale indicator span tags
                const tags = btn.querySelectorAll('.vote-indicator');
                tags.forEach(t => t.remove());

                if(p1Idx === idx) {
                    const marker = document.createElement('span');
                    marker.className = "vote-indicator vote-p1";
                    marker.textContent = isHost ? "YOU" : "P1";
                    btn.appendChild(marker);
                }
                if(p2Idx === idx) {
                    const marker = document.createElement('span');
                    marker.className = "vote-indicator vote-p2";
                    marker.style.right = (p1Idx === idx) ? "65px" : "10px"; // prevent overlapping tags
                    marker.textContent = !isHost ? "YOU" : "P2";
                    btn.appendChild(marker);
                }
            });
        }
    </script>
</body>
</html>

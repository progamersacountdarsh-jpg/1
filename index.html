<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 6 Fast-Paced Dynamic Quiz</title>
    <!-- PeerJS for seamless direct device-to-device connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #ff7675;
            --secondary: #74b9ff;
            --bg: #1e1b4b;
            --card-bg: #2e2a72;
            --text: #ffffff;
            --success: #55efc4;
            --error: #ff7675;
            --warning: #fdcb6e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg), #4338ca);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffeaa7;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 3px solid var(--secondary);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fdcb6e;
            color: #2d3436;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 0 #b2bec3;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #ffeaa7;
            font-weight: bold;
        }

        .room-display {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border: 2px dashed #fdcb6e;
        }

        .room-code-highlight {
            font-size: 28px;
            font-weight: bold;
            color: #55efc4;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        /* Live Scoreboards */
        .live-scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-box:first-child {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 26px;
            font-weight: bold;
            color: #55efc4;
        }

        /* Difficulty Flasher Overlay Alert Banner */
        .difficulty-banner {
            display: none;
            background: linear-gradient(90deg, #d63031, #e17055);
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: pulse 0.6s infinite alternate;
            border: 2px solid #ffeaa7;
        }

        @keyframes pulse {
            from { transform: scale(0.98); opacity: 0.9; }
            to { transform: scale(1.02); opacity: 1; }
        }

        /* Timer components */
        .timer-container {
            width: 100%;
            height: 14px;
            background: #333;
            border-radius: 7px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: #ff7675;
            transition: width 1s linear;
        }

        /* Quiz Main Display Items */
        .question-text {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--secondary);
            color: #1e1b4b;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0984e3;
        }

        .option-btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 5px;
            background: rgba(255,255,255,0.1);
        }
    </script>
</head>
<body>

    <div class="container">
        <!-- DIFFICULTY WARNING BANNER -->
        <div id="difficulty-alert" class="difficulty-banner">⚠️ WARNING: DIFFICULTY LEVEL RISING! ⚠️</div>

        <!-- SCREEN 1: Setup & Connection Menu -->
        <div id="setup-screen" class="screen active">
            <h1>🎒 Class 6 Adaptive Arena ✏️</h1>
            <div class="input-group">
                <label for="username">Your Nickname:</label>
                <input type="text" id="username" placeholder="Type your name here...">
            </div>
            
            <hr style="opacity: 0.1; margin: 25px 0;">

            <button onclick="initiateHost()">Option A: Create a New Room</button>
            <div class="divider">OR</div>
            
            <div class="input-group">
                <label for="join-room-id">Enter Friend's Room Code:</label>
                <input type="text" id="join-room-id" placeholder="e.g., quiz-1234">
            </div>
            <button style="background: #a29bfe; color: #1e1b4b; box-shadow: 0 4px 0 #6c5ce7;" onclick="connectToHost()">Option B: Join Friend's Room</button>
        </div>

        <!-- SCREEN 2: Waiting Lobby -->
        <div id="waiting-screen" class="screen">
            <h2>Lobby Status</h2>
            <div id="room-info-display" class="room-display" style="display:none;">
                Tell your friend to enter this code:<br>
                <span id="generated-code" class="room-code-highlight">---</span>
            </div>
            <div style="text-align: center; font-style: italic; color: #ffeaa7;">Setting up network connection...</div>
        </div>

        <!-- SCREEN 3: Live Gameplay -->
        <div id="quiz-screen" class="screen">
            <div class="live-scoreboard">
                <div class="score-box">
                    <div id="my-name-label" style="font-weight: bold;">You</div>
                    <div class="score-val" id="my-live-score">0</div>
                    <div id="my-status-tag" class="status-badge" style="color: #55efc4;">Playing</div>
                </div>
                <div class="score-box">
                    <div id="opp-name-label" style="font-weight: bold;">Opponent</div>
                    <div class="score-val" id="opp-live-score">0</div>
                    <div id="opp-status-tag" class="status-badge" style="color: #74b9ff;">Playing</div>
                </div>
            </div>

            <div class="timer-container">
                <div id="timer" class="timer-bar"></div>
            </div>

            <div class="question-text" id="question-text">Generating fresh question...</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- SCREEN 4: Immediate Interactive Live Results -->
        <div id="results-screen" class="screen">
            <h1>✨ Live Score Report ✨</h1>
            <div class="live-scoreboard" style="background: rgba(255,255,255,0.05); margin: 25px 0;">
                <div class="score-box">
                    <div id="res-my-name" style="font-weight: bold; font-size: 20px;">You</div>
                    <div class="score-val" id="res-my-score" style="font-size: 42px;">0</div>
                    <div id="res-my-tag" style="color: #55efc4; margin-top: 5px; font-weight: bold;">Finished</div>
                </div>
                <div class="score-box">
                    <div id="res-opp-name" style="font-weight: bold; font-size: 20px;">Opponent</div>
                    <div class="score-val" id="res-opp-score" style="font-size: 42px;">0</div>
                    <div id="res-opp-tag" style="color: #fdcb6e; margin-top: 5px; font-weight: bold;">Still Racing...</div>
                </div>
            </div>
            <h2 id="winner-live-text" style="color: #ffeaa7; font-size: 26px; text-align: center; min-height: 40px; white-space: pre-wrap;"></h2>
            <button onclick="location.reload()" style="background: #55efc4; box-shadow: 0 4px 0 #00b894; margin-top: 20px;">Back to Main Menu</button>
        </div>
    </div>

    <script>
        let peer = null;
        let connection = null;
        let myName = "";
        let opponentName = "Opponent";
        
        let currentQuestionIndex = 0;
        const totalQuestionsPerMatch = 10; 
        
        let myScore = 0;
        let oppScore = 0;
        
        let timeLeft = 10; 
        let timerInterval;
        let myFinished = false;
        let oppFinished = false;
        let currentQuestion = null;

        let sessionQuestionSequence = [];

        function buildUniqueMatchSequence() {
            // Expanded categoric lists to prevent any back-to-back duplicate templates
            const basicCategories = [
                'math_perimeter', 'math_prime', 'math_fraction', 'math_ratio', 
                'science_water', 'science_materials', 'science_magnets', 
                'geo_planets', 'geo_lines', 'geo_rotation'
            ];
            let pool = [];
            while(pool.length < totalQuestionsPerMatch) {
                let batch = [...basicCategories].sort(() => Math.random() - 0.5);
                pool = pool.concat(batch);
            }
            sessionQuestionSequence = pool.slice(0, totalQuestionsPerMatch);
        }

        // ==========================================
        // ADAPTIVE HARDNESS ESCALATION ENGINE
        // ==========================================
        function generateDynamicQuestion(index) {
            const chosenType = sessionQuestionSequence[index];
            
            // Difficulty tier tracking based on every 2 questions answered 
            // Questions 1-2: Easy (Tier 1), 3-4: Medium (Tier 2), 5-6: Hard (Tier 3), 7+: Expert (Tier 4)
            const difficultyTier = Math.floor(index / 2) + 1; 

            let q = "";
            let options = [];
            let correct = 0;

            switch(chosenType) {
                case 'math_perimeter': {
                    // Scales dimensions higher as hardness advances
                    const baseMultiplier = difficultyTier * 8; 
                    const side = Math.floor(Math.random() * 12) + baseMultiplier;
                    
                    const shapes = [
                        { name: "square", mult: 4 },
                        { name: "regular triangle", mult: 3 },
                        { name: "regular pentagon", mult: 5 },
                        { name: "regular hexagon", mult: 6 }
                    ];
                    const targetShape = shapes[Math.floor(Math.random() * shapes.length)];
                    const ans = side * targetShape.mult;

                    q = `[Tier ${difficultyTier}] Find the perimeter of a ${targetShape.name} if each side measures exactly ${side} cm.`;
                    options = [`${ans - targetShape.mult} cm`, `${ans} cm`, `${ans + side} cm`].sort(() => Math.random() - 0.5);
                    correct = options.indexOf(`${ans} cm`);
                    break;
                }
                case 'math_prime': {
                    let primesPool = [];
                    if (difficultyTier <= 2) {
                        primesPool = [2, 3, 5, 7, 11, 13, 17, 19];
                    } else {
                        primesPool = [43, 47, 53, 59, 61, 67, 71, 73, 79, 83, 89, 97];
                    }
                    const targetPrime = primesPool[Math.floor(Math.random() * primesPool.length)];
                    q = `[Tier ${difficultyTier}] Identify the hidden Prime Number among the choices below:`;
                    options = [targetPrime, targetPrime + 1, targetPrime - 1].sort(() => Math.random() - 0.5);
                    // Ensure edge cases where targetPrime +/- 1 might produce another prime are averted
                    options = [...new Set(options)];
                    while(options.length < 3) { options.push(targetPrime + 4); }
                    correct = options.indexOf(targetPrime);
                    break;
                }
                case 'math_fraction': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] A fraction where the top numerator is greater than the bottom denominator is known as an...`;
                        options = ["Proper Fraction", "Improper Fraction", "Mixed Fraction"];
                        correct = 1;
                    } else {
                        // Hard Tier Decimal Fraction Conversion
                        q = `[Tier ${difficultyTier}] Convert the fraction 3/5 into its exact matching decimal values:`;
                        options = ["0.35", "0.6", "0.06", "3.5"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("0.6");
                    }
                    break;
                }
                case 'math_ratio': {
                    const multi = difficultyTier * 3;
                    const boys = 4 * multi; 
                    const girls = 3 * multi; 
                    q = `[Tier ${difficultyTier}] A Class 6 study team has ${boys} boys and ${girls} girls. What is the ratio of boys to girls in simplest form?`;
                    options = ["4:3", "3:4", `${boys}:${girls}`].sort(() => Math.random() - 0.5);
                    correct = options.indexOf("4:3");
                    break;
                }
                case 'science_water': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] What is the primary process called when water changes into gas vapor?`;
                        options = ["Evaporation", "Condensation", "Precipitation"];
                        correct = 0;
                    } else {
                        q = `[Tier ${difficultyTier}] Plants transpire excess water vapor into the atmosphere via tiny leaf microscopic openings called...`;
                        options = ["Stomata", "Chlorophyll", "Root Hairs", "Xylem"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("Stomata");
                    }
                    break;
                }
                case 'science_materials': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] Materials that completely block light transmissions are classified as:`;
                        options = ["Transparent", "Opaque", "Translucent"];
                        correct = 1;
                    } else {
                        q = `[Tier ${difficultyTier}] Which type of component change happens when paper burns into completely fresh ash?`;
                        options = ["Physical Change", "Chemical Change", "Reversible Change"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("Chemical Change");
                    }
                    break;
                }
                case 'science_magnets': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] Like poles of two separate magnets will always...`;
                        options = ["Repel each other", "Attract each other", "Rotate endlessly"];
                        correct = 0;
                    } else {
                        q = `[Tier ${difficultyTier}] Which of the following elements is highly magnetic and easily attracted to a permanent magnet bar?`;
                        options = ["Copper", "Aluminum", "Iron", "Gold"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("Iron");
                    }
                    break;
                }
                case 'geo_planets': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] Which inner rocky world is commonly called the Red Planet?`;
                        options = ["Venus", "Mars", "Mercury"];
                        correct = 1;
                    } else {
                        q = `[Tier ${difficultyTier}] Which outer planet has the most extensive, bright ice ring system visible from space?`;
                        options = ["Jupiter", "Saturn", "Neptune", "Uranus"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("Saturn");
                    }
                    break;
                }
                case 'geo_lines': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] Name the primary 0° reference line running horizontally around the middle of Earth:`;
                        options = ["The Equator", "The Prime Meridian", "Tropic of Capricorn"];
                        correct = 0;
                    } else {
                        q = `[Tier ${difficultyTier}] What specific latitude angle location defines the Tropic of Cancer in the northern hemisphere?`;
                        options = ["23.5° North", "23.5° South", "66.5° North", "0°"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("23.5° North");
                    }
                    break;
                }
                case 'geo_rotation': {
                    if (difficultyTier <= 2) {
                        q = `[Tier ${difficultyTier}] The daily rotational spinning loop of the planet on its axis directly creates:`;
                        options = ["The 4 Seasons", "Day and Night", "Ocean tides"];
                        correct = 1;
                    } else {
                        q = `[Tier ${difficultyTier}] The precise complete period required for Earth to finish one full orbital revolution around the Sun is:`;
                        options = ["24 Hours", "30 Days", "365.25 Days", "28 Days"].sort(() => Math.random() - 0.5);
                        correct = options.indexOf("365.25 Days");
                    }
                    break;
                }
            }

            return { q, options, correct };
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ==========================================
        // PEER CONNECTION MANAGEMENTS
        // ==========================================
        function initiateHost() {
            myName = document.getElementById('username').value.trim() || "Host Player";
            showScreen('waiting-screen');

            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const hostRoomId = `quiz-${randomCode}`;

            peer = new Peer(hostRoomId);
            peer.on('open', (id) => {
                document.getElementById('room-info-display').style.display = 'block';
                document.getElementById('generated-code').textContent = id;
            });
            peer.on('connection', (conn) => {
                connection = conn;
                setupConnectionListeners();
            });
        }

        function connectToHost() {
            myName = document.getElementById('username').value.trim() || "Guest Player";
            const targetRoomId = document.getElementById('join-room-id').value.trim();

            if (!targetRoomId) {
                alert("Please type your friend's room code first!");
                return;
            }

            showScreen('waiting-screen');
            peer = new Peer(); 
            peer.on('open', () => {
                connection = peer.connect(targetRoomId);
                setupConnectionListeners();
            });
            peer.on('error', () => {
                alert("Room not found! Check numbers and try again.");
                location.reload();
            });
        }

        function setupConnectionListeners() {
            connection.on('open', () => {
                buildUniqueMatchSequence();
                connection.send({ type: 'HANDSHAKE', name: myName });
            });

            connection.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    opponentName = data.name;
                    startGameUi();
                } else if (data.type === 'SCORE_UPDATE') {
                    oppScore = data.score;
                    document.getElementById('opp-live-score').textContent = oppScore;
                    document.getElementById('res-opp-score').textContent = oppScore;
                    if (data.finished) {
                        oppFinished = true;
                        document.getElementById('opp-status-tag').textContent = "Finished";
                        document.getElementById('opp-status-tag').style.color = "#ff7675";
                        document.getElementById('res-opp-tag').textContent = "Finished";
                        document.getElementById('res-opp-tag').style.color = "#55efc4";
                    }
                    updateWinnerDisplayText();
                } else if (data.type === 'DIFFICULTY_UP') {
                    triggerDifficultyBannerFlash();
                }
            });
        }

        function startGameUi() {
            document.getElementById('my-name-label').textContent = myName;
            document.getElementById('res-my-name').textContent = myName;
            document.getElementById('opp-name-label').textContent = opponentName;
            document.getElementById('res-opp-name').textContent = opponentName;
            showScreen('quiz-screen');
            loadQuestion();
        }

        // ==========================================
        // CORE GAMEPLAY PROCESSING FUNCTIONS
        // ==========================================
        function loadQuestion() {
            // Check if difficulty alert banner should trigger (every 2 questions)
            if (currentQuestionIndex > 0 && currentQuestionIndex % 2 === 0) {
                triggerDifficultyBannerFlash();
                // Send an immediate sync alert to flashing peer's UI too
                connection.send({ type: 'DIFFICULTY_UP' });
            }

            timeLeft = 10; 
            currentQuestion = generateDynamicQuestion(currentQuestionIndex);
            
            document.getElementById('question-text').textContent = `Q${currentQuestionIndex + 1}/${totalQuestionsPerMatch}: ${currentQuestion.q}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQuestion.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx);
                container.appendChild(btn);
            });

            startTimer();
        }

        function triggerDifficultyBannerFlash() {
            const banner = document.getElementById('difficulty-alert');
            banner.style.display = 'block';
            setTimeout(() => {
                banner.style.display = 'none';
            }, 3000); // Flashes notices for 3 structural seconds then hides gracefully
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); 
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 10) * 100; 
            document.getElementById('timer').style.width = `${percentage}%`;
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timerInterval);

            if (selectedIndex === currentQuestion.correct) {
                myScore += 10;
                document.getElementById('my-live-score').textContent = myScore;
                document.getElementById('res-my-score').textContent = myScore;
            }

            currentQuestionIndex++;
            myFinished = (currentQuestionIndex >= totalQuestionsPerMatch);

            // Sync structural parameters instantly to peer device
            connection.send({
                type: 'SCORE_UPDATE',
                score: myScore,
                finished: myFinished
            });

            if (!myFinished) {
                loadQuestion();
            } else {
                // NO MORE WAITING! Instantly jump to the Interactive Live Result Screen
                document.getElementById('my-status-tag').textContent = "Finished";
                showScreen('results-screen');
                updateWinnerDisplayText();
            }
        }

        function updateWinnerDisplayText() {
            const winLabel = document.getElementById('winner-live-text');
            
            if (myFinished && oppFinished) {
                if (myScore > oppScore) {
                    winLabel.innerText = `👑 Match Over: You Won!\n🥇 final score: ${myScore} to ${oppScore}`;
                    winLabel.style.color = "#55efc4";
                } else if (oppScore > myScore) {
                    winLabel.innerText = `🎉 Match Over: ${opponentName} Wins!\n🥈 final score: ${oppScore} to ${myScore}`;
                    winLabel.style.color = "#ff7675";
                } else {
                    winLabel.innerText = `🤝 Match Over: It's a Tie!\nScore: ${myScore} - ${oppScore}`;
                    winLabel.style.color = "#ffeaa7";
                }
            } else if (myFinished && !oppFinished) {
                winLabel.innerText = `You finished! Current Standings:\nYou: ${myScore} pts | ${opponentName}: ${oppScore} pts\n(Keep tracking, your friend is still solving...)`;
                winLabel.style.color = "#fdcb6e";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 6 Rapid Random Quiz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #ff7675;
            --secondary: #74b9ff;
            --bg: #1e1b4b;
            --card-bg: #2e2a72;
            --text: #ffffff;
            --success: #55efc4;
            --error: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg), #4338ca);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffeaa7;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 3px solid var(--secondary);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fdcb6e;
            color: #2d3436;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 0 #b2bec3;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #ffeaa7;
            font-weight: bold;
        }

        .room-display {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border: 2px dashed #fdcb6e;
        }

        .room-code-highlight {
            font-size: 28px;
            font-weight: bold;
            color: #55efc4;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        /* Live Scoreboard Header */
        .live-scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-box:first-child {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 26px;
            font-weight: bold;
            color: #55efc4;
        }

        /* Timer components */
        .timer-container {
            width: 100%;
            height: 14px;
            background: #333;
            border-radius: 7px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: #ff7675;
            transition: width 1s linear;
        }

        /* Quiz UI */
        .question-text {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--secondary);
            color: #1e1b4b;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0984e3;
        }

        .option-btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .waiting-msg {
            text-align: center;
            font-style: italic;
            color: #ffeaa7;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen" class="screen active">
            <h1>🎒 Class 6 Random Quiz Arena ✏️</h1>
            <div class="input-group">
                <label for="username">Your Nickname:</label>
                <input type="text" id="username" placeholder="Type your name here...">
            </div>
            
            <hr style="opacity: 0.1; margin: 25px 0;">

            <button onclick="initiateHost()">Option A: Create a New Room</button>
            
            <div class="divider">OR</div>
            
            <div class="input-group">
                <label for="join-room-id">Enter Friend's Room Code:</label>
                <input type="text" id="join-room-id" placeholder="e.g., quiz-1234">
            </div>
            <button style="background: #a29bfe; color: #1e1b4b; box-shadow: 0 4px 0 #6c5ce7;" onclick="connectToHost()">Option B: Join Friend's Room</button>
        </div>

        <div id="waiting-screen" class="screen">
            <h2>Lobby Status</h2>
            <div id="room-info-display" class="room-display" style="display:none;">
                Tell your friend to enter this code:<br>
                <span id="generated-code" class="room-code-highlight">---</span>
            </div>
            <div class="waiting-msg" id="waiting-status">Setting up network connection...</div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="live-scoreboard">
                <div class="score-box">
                    <div id="my-name-label" style="font-weight: bold;">You</div>
                    <div class="score-val" id="my-live-score">0</div>
                </div>
                <div class="score-box">
                    <div id="opp-name-label" style="font-weight: bold;">Opponent</div>
                    <div class="score-val" id="opp-live-score">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div id="timer" class="timer-bar"></div>
            </div>

            <div class="question-text" id="question-text">Get Ready...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="waiting-msg" id="status-message"></div>
        </div>

        <div id="results-screen" class="screen">
            <h1>✨ Match Results ✨</h1>
            <h2 id="winner-text" style="color: #55efc4; font-size: 32px; text-align: center; margin: 25px 0; white-space: pre-wrap;"></h2>
            <button onclick="location.reload()" style="background: #55efc4; box-shadow: 0 4px 0 #00b894;">Play Again</button>
        </div>
    </div>

    <script>
        // Expanded Class 6 Master Question Pool
        const masterQuizData = [
            // Science & Materials
            { q: "What is the process of changing water into water vapor called?", options: ["Condensation", "Evaporation", "Freezing"], correct: 1 },
            { q: "Which of these components is a component of food that does NOT provide energy, but helps clear waste?", options: ["Vitamins", "Roughage / Dietary Fibre", "Carbohydrates"], correct: 1 },
            { q: "What kind of joint is found between our head and upper neck?", options: ["Hinge Joint", "Ball and Socket Joint", "Pivotal Joint"], correct: 2 },
            { q: "Which of the following is a luminous object?", options: ["The Moon", "The Sun", "A Wooden Table"], correct: 1 },
            { q: "What do we call materials through which objects can be seen, but not clearly?", options: ["Transparent", "Opaque", "Translucent"], correct: 2 },
            // Mathematics
            { q: "What is the perimeter of a regular triangle with each side measuring 5 cm?", options: ["10 cm", "15 cm", "25 cm"], correct: 1 },
            { q: "What is the smallest prime number?", options: ["1", "2", "3"], correct: 1 },
            { q: "A fraction with a numerator greater than its denominator is called a...", options: ["Proper Fraction", "Improper Fraction", "Mixed Fraction"], correct: 1 },
            // History & Geography
            { q: "Which imaginary line divides the Earth into the Northern and Southern Hemispheres?", options: ["The Equator", "Tropic of Cancer", "Prime Meridian"], correct: 0 },
            { q: "What are maps that show natural physical features of the earth called?", options: ["Political Maps", "Physical Maps", "Thematic Maps"], correct: 1 },
            { q: "Which planet is closest to the Sun?", options: ["Earth", "Venus", "Mercury"], correct: 2 },
            { q: "What is the script used to write the Hindi language?", options: ["Devanagari", "Roman", "Brahmi"], correct: 0 }
        ];

        let quizData = []; // This will hold the randomized selection for this session
        let peer = null;
        let connection = null;
        let myName = "";
        let opponentName = "Opponent";
        
        let currentQuestionIndex = 0;
        let myScore = 0;
        let oppScore = 0;
        
        let timeLeft = 10; 
        let timerInterval;
        let myFinished = false;
        let oppFinished = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Shuffles an array randomly
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Prepare 6 random questions from our pool
        function setupRandomQuestions() {
            let shuffled = shuffleArray([...masterQuizData]);
            // Pick a fixed number of questions per game (e.g., 6 questions)
            quizData = shuffled.slice(0, 6);
        }

        // ==========================================
        // HOST ROOM
        // ==========================================
        function initiateHost() {
            myName = document.getElementById('username').value.trim() || "Host Player";
            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Creating code...";

            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const hostRoomId = `quiz-${randomCode}`;

            peer = new Peer(hostRoomId);

            peer.on('open', (id) => {
                document.getElementById('room-info-display').style.display = 'block';
                document.getElementById('generated-code').textContent = id;
                document.getElementById('waiting-status').textContent = "Waiting for your friend to join...";
            });

            peer.on('connection', (conn) => {
                connection = conn;
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Error: Room creation failed! Try clicking the host button again.");
                location.reload();
            });
        }

        // ==========================================
        // JOIN ROOM
        // ==========================================
        function connectToHost() {
            myName = document.getElementById('username').value.trim() || "Guest Player";
            const targetRoomId = document.getElementById('join-room-id').value.trim();

            if (!targetRoomId) {
                alert("Please type your friend's room code first!");
                return;
            }

            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Connecting to your friend's room...";

            peer = new Peer(); 

            peer.on('open', () => {
                connection = peer.connect(targetRoomId);
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Could not find that room code. Check the numbers and try again!");
                location.reload();
            });
        }

        // ==========================================
        // REALTIME SYNC LOGIC
        // ==========================================
        function setupConnectionDataListeners() {
            connection.on('open', () => {
                // Initialize random questions locally on connect
                setupRandomQuestions();
                connection.send({ type: 'HANDSHAKE', name: myName });
            });

            connection.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    opponentName = data.name;
                    startGameUi();
                } else if (data.type === 'SCORE_UPDATE') {
                    oppScore = data.score;
                    document.getElementById('opp-live-score').textContent = oppScore;
                } else if (data.type === 'FINISHED') {
                    oppFinished = true;
                    checkMatchEnd();
                }
            });

            connection.on('close', () => {
                alert("Your friend left the game.");
                location.reload();
            });
        }

        function startGameUi() {
            document.getElementById('my-name-label').textContent = myName;
            document.getElementById('opp-name-label').textContent = opponentName;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            timeLeft = 10; 
            document.getElementById('status-message').textContent = "";
            
            const currentQ = quizData[currentQuestionIndex];
            document.getElementById('question-text').textContent = `Q${currentQuestionIndex + 1}: ${currentQ.q}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); 
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 10) * 100; 
            document.getElementById('timer').style.width = `${percentage}%`;
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timerInterval);

            const currentQ = quizData[currentQuestionIndex];
            if (selectedIndex === currentQ.correct) {
                myScore += 10;
                document.getElementById('my-live-score').textContent = myScore;
            }

            // Sync score live to opponent
            connection.send({
                type: 'SCORE_UPDATE',
                score: myScore
            });

            // Instant progress to next index card
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                myFinished = true;
                connection.send({ type: 'FINISHED' });
                
                document.getElementById('question-text').textContent = "You finished all questions!";
                document.getElementById('options-container').innerHTML = "";
                document.getElementById('timer').style.width = "0%";
                document.getElementById('status-message').textContent = `Waiting for ${opponentName} to complete their round...`;
                
                checkMatchEnd();
            }
        }

        function checkMatchEnd() {
            if (myFinished && oppFinished) {
                showScreen('results-screen');
                let resultText = "";
                if (myScore > oppScore) {
                    resultText = `👑 You won!\n🥇 ${myScore} pts to ${oppScore} pts`;
                } else if (oppScore > myScore) {
                    resultText = `🎉 ${opponentName} wins!\n🥈 ${myScore} pts to ${oppScore} pts`;
                } else {
                    resultText = `🤝 It's a Tie!\nScore: ${myScore} - ${oppScore}`;
                }
                document.getElementById('winner-text').innerText = resultText;
            }
        }
    </script>
</body>
</html>

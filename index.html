<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Multiplayer Quiz Battle</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #ff7675;
            --secondary: #74b9ff;
            --bg: #1e1b4b;
            --card-bg: #2e2a72;
            --text: #ffffff;
            --success: #55efc4;
            --error: #ff7675;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg), #4338ca);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffeaa7;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 3px solid var(--secondary);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #fdcb6e;
            color: #2d3436;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 0 #b2bec3;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #ffeaa7;
            font-weight: bold;
        }

        .room-display {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border: 2px dashed #fdcb6e;
        }

        .room-code-highlight {
            font-size: 28px;
            font-weight: bold;
            color: #55efc4;
            letter-spacing: 2px;
            display: block;
            margin-top: 5px;
        }

        /* Live Scoreboard Header */
        .live-scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-box:first-child {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 26px;
            font-weight: bold;
            color: #55efc4;
        }

        /* Timer bar components */
        .timer-container {
            width: 100%;
            height: 14px;
            background: #333;
            border-radius: 7px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: #ff7675;
            transition: width 1s linear;
        }

        /* Quiz UI */
        .question-text {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: var(--secondary);
            color: #1e1b4b;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0984e3;
        }

        .option-btn:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .option-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .waiting-msg {
            text-align: center;
            font-style: italic;
            color: #ffeaa7;
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen" class="screen active">
            <h1>🎒 Kid's Quiz Arena ✏️</h1>
            <div class="input-group">
                <label for="username">Your Nickname:</label>
                <input type="text" id="username" placeholder="Type your name here...">
            </div>
            
            <hr style="opacity: 0.1; margin: 25px 0;">

            <button onclick="initiateHost()">Option A: Create a New Room</button>
            
            <div class="divider">OR</div>
            
            <div class="input-group">
                <label for="join-room-id">Enter Friend's Room Code:</label>
                <input type="text" id="join-room-id" placeholder="e.g., quiz-1234">
            </div>
            <button style="background: #a29bfe; color: #1e1b4b; box-shadow: 0 4px 0 #6c5ce7;" onclick="connectToHost()">Option B: Join Friend's Room</button>
        </div>

        <div id="waiting-screen" class="screen">
            <h2>Lobby Status</h2>
            <div id="room-info-display" class="room-display" style="display:none;">
                Tell your friend to enter this code:<br>
                <span id="generated-code" class="room-code-highlight">---</span>
            </div>
            <div class="waiting-msg" id="waiting-status">Setting up network connection...</div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="live-scoreboard">
                <div class="score-box">
                    <div id="my-name-label" style="font-weight: bold;">You</div>
                    <div class="score-val" id="my-live-score">0</div>
                </div>
                <div class="score-box">
                    <div id="opp-name-label" style="font-weight: bold;">Opponent</div>
                    <div class="score-val" id="opp-live-score">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div id="timer" class="timer-bar"></div>
            </div>

            <div class="question-text" id="question-text">Get Ready...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="waiting-msg" id="status-message"></div>
        </div>

        <div id="results-screen" class="screen">
            <h1>✨ Match Results ✨</h1>
            <h2 id="winner-text" style="color: #55efc4; font-size: 32px; text-align: center; margin: 25px 0;"></h2>
            <button onclick="location.reload()" style="background: #55efc4; box-shadow: 0 4px 0 #00b894;">Play Again</button>
        </div>
    </div>

    <script>
        // Class 5th & 6th grade school quiz questions pool
        const quizData = [
            { q: "Which planet in our solar system is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter"], correct: 1 },
            { q: "What is the boiling point of water in degrees Celsius?", options: ["50°C", "100°C", "200°C"], correct: 1 },
            { q: "How many sides does a regular hexagon have?", options: ["5 sides", "6 sides", "8 sides"], correct: 1 },
            { q: "Which gas do plants absorb from the air during photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide"], correct: 2 },
            { q: "What is the largest organ in the human body?", options: ["The Skin", "The Liver", "The Brain"], correct: 0 },
            { q: "How many years are there in a single century?", options: ["10 years", "50 years", "100 years"], correct: 2 }
        ];

        let peer = null;
        let connection = null;
        let myName = "";
        let opponentName = "Opponent";
        
        let currentQuestionIndex = 0;
        let myScore = 0;
        let oppScore = 0;
        
        let timeLeft = 15; // Changed timer configuration from 20s to 15s
        let timerInterval;
        let answeredCurrentQuestion = false;
        let opponentFinishedQuestion = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ==========================================
        // HOST ROOM
        // ==========================================
        function initiateHost() {
            myName = document.getElementById('username').value.trim() || "Host Player";
            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Creating code...";

            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const hostRoomId = `quiz-${randomCode}`;

            peer = new Peer(hostRoomId);

            peer.on('open', (id) => {
                document.getElementById('room-info-display').style.display = 'block';
                document.getElementById('generated-code').textContent = id;
                document.getElementById('waiting-status').textContent = "Waiting for your friend to join...";
            });

            peer.on('connection', (conn) => {
                connection = conn;
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Error: Room creation failed! Try clicking the host button again.");
                location.reload();
            });
        }

        // ==========================================
        // JOIN ROOM
        // ==========================================
        function connectToHost() {
            myName = document.getElementById('username').value.trim() || "Guest Player";
            const targetRoomId = document.getElementById('join-room-id').value.trim();

            if (!targetRoomId) {
                alert("Please type your friend's room code first!");
                return;
            }

            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Connecting to your friend's room...";

            peer = new Peer(); 

            peer.on('open', () => {
                connection = peer.connect(targetRoomId);
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Could not find that room code. Check the numbers and try again!");
                location.reload();
            });
        }

        // ==========================================
        // REALTIME SYNC LOGIC
        // ==========================================
        function setupConnectionDataListeners() {
            connection.on('open', () => {
                connection.send({ type: 'HANDSHAKE', name: myName });
            });

            connection.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    opponentName = data.name;
                    startGameUi();
                } else if (data.type === 'SCORE_UPDATE') {
                    oppScore = data.score;
                    document.getElementById('opp-live-score').textContent = oppScore;
                    if (data.questionIndex === currentQuestionIndex) {
                        opponentFinishedQuestion = true;
                        checkAdvanceCondition();
                    }
                }
            });

            connection.on('close', () => {
                alert("Your friend left the game.");
                location.reload();
            });
        }

        function startGameUi() {
            document.getElementById('my-name-label').textContent = myName;
            document.getElementById('opp-name-label').textContent = opponentName;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrentQuestion = false;
            opponentFinishedQuestion = false;
            timeLeft = 15; // Set clock value back to full 15s bar
            document.getElementById('status-message').textContent = "";
            
            const currentQ = quizData[currentQuestionIndex];
            document.getElementById('question-text').textContent = `Q${currentQuestionIndex + 1}: ${currentQ.q}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); // Automatically trigger time out limit response
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 15) * 100; // Recalculated out of 15 seconds
            document.getElementById('timer').style.width = `${percentage}%`;
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timerInterval);
            answeredCurrentQuestion = true;

            // Gray out options so they can't double click
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            const currentQ = quizData[currentQuestionIndex];
            if (selectedIndex === currentQ.correct) {
                myScore += 10;
                document.getElementById('my-live-score').textContent = myScore;
            }

            // Broadcast scores immediately down the data pipeline stream
            connection.send({
                type: 'SCORE_UPDATE',
                score: myScore,
                questionIndex: currentQuestionIndex
            });

            document.getElementById('status-message').textContent = `Waiting for ${opponentName} to answer...`;
            checkAdvanceCondition();
        }

        function checkAdvanceCondition() {
            // Wait until both kids answer before jumping forward to the next level question
            if (answeredCurrentQuestion && opponentFinishedQuestion) {
                currentQuestionIndex++;
                setTimeout(() => {
                    if (currentQuestionIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 1200); 
            }
        }

        function endGame() {
            showScreen('results-screen');
            let resultText = "";
            if (myScore > oppScore) {
                resultText = `👑 You won!\n🥇 ${myScore} pts to ${oppScore} pts`;
            } else if (oppScore > myScore) {
                resultText = `🎉 ${opponentName} wins!\n🥈 ${myScore} pts to ${oppScore} pts`;
            } else {
                resultText = `🤝 It's a Tie!\nScore: ${myScore} - ${oppScore}`;
            }
            document.getElementById('winner-text').innerText = resultText;
        }
    </script>
</body>
</html>

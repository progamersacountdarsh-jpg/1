<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Multiplayer Quiz</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #0f0c1b;
            --card-bg: #1c1432;
            --text: #ffffff;
            --success: #00b894;
            --error: #d63031;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg), #2d142c);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        /* Setup Screen */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        /* Waiting Screen */
        .loader {
            text-align: center;
            font-size: 18px;
            color: var(--secondary);
            margin: 20px 0;
        }

        /* Live Scoreboard Header */
        .live-scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-box:first-child {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--success);
        }

        /* Timer components */
        .timer-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: var(--error);
            transition: width 1s linear;
        }

        /* Quiz UI */
        .question-text {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Feedback status */
        .waiting-msg {
            text-align: center;
            font-style: italic;
            color: var(--secondary);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen" class="screen active">
            <h1>Multiplayer Quiz Battle</h1>
            <div class="input-group">
                <label for="username">Your Name:</label>
                <input type="text" id="username" placeholder="Enter your name...">
            </div>
            <div class="input-group">
                <label for="room-id">Game Room ID (Must match your friend's room ID):</label>
                <input type="text" id="room-id" value="quiz-room-123" placeholder="Enter a shared room code">
            </div>
            <button onclick="connectToGame()">Join Game Room</button>
        </div>

        <div id="waiting-screen" class="screen">
            <h2>Connecting...</h2>
            <div class="loader" id="waiting-status">Waiting for Opponent to connect to this room...</div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="live-scoreboard">
                <div class="score-box">
                    <div id="my-name-label">You</div>
                    <div class="score-val" id="my-live-score">0</div>
                </div>
                <div class="score-box">
                    <div id="opp-name-label">Opponent</div>
                    <div class="score-val" id="opp-live-score">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div id="timer" class="timer-bar"></div>
            </div>

            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="waiting-msg" id="status-message"></div>
        </div>

        <div id="results-screen" class="screen">
            <h1>Game Over!</h1>
            <h2 id="winner-text" style="color: var(--success); font-size: 28px;">Calculating...</h2>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Shared questions pool
        const quizData = [
            { q: "What does HTML stand for?", options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyperlinks and Text Markup Language"], correct: 0 },
            { q: "Which language provides logic and interactivity to a web page?", options: ["CSS", "HTML", "JavaScript"], correct: 2 },
            { q: "Which HTML element is used to insert a line break?", options: ["<lb>", "<br>", "<break>"], correct: 1 },
            { q: "Which CSS property controls text size?", options: ["text-style", "text-size", "font-size"], correct: 2 }
        ];

        let pubnub;
        let myId = 'user_' + Math.random().toString(36).substr(2, 9); 
        let myName = "";
        let opponentName = "Opponent";
        let roomChannel = "";
        
        let currentQuestionIndex = 0;
        let myScore = 0;
        let oppScore = 0;
        
        let timeLeft = 20;
        let timerInterval;
        let answeredCurrentQuestion = false;
        let opponentFinishedQuestion = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Initialize Realtime Network
        function connectToGame() {
            myName = document.getElementById('username').value.trim() || "Anonymous";
            roomChannel = document.getElementById('room-id').value.trim() || "default-quiz-room";

            if (!roomChannel) return alert("Please enter a room ID");

            showScreen('waiting-screen');

            // Initialize free tier fallback communication layer
            pubnub = new PubNub({
                publishKey: 'pub-c-4b5377f0-ca7d-4113-9a3d-4c74070a9314', // Public Demo Keys
                subscribeKey: 'sub-c-4e78db5e-99bc-11ea-ab81-ba242cc3ff86',
                userId: myId
            });

            pubnub.subscribe({ channels: [roomChannel] });

            pubnub.addListener({
                message: function(event) {
                    handleIncomingNetworkMessage(event.message);
                }
            });

            // Announce presence every second until opponent replies
            timerInterval = setInterval(() => {
                broadcast({ type: "JOIN_PING", name: myName, senderId: myId });
            }, 1000);
        }

        function broadcast(msg) {
            pubnub.publish({ channel: roomChannel, message: msg });
        }

        function handleIncomingNetworkMessage(msg) {
            if (msg.senderId === myId) return; // Skip own messages

            switch(msg.type) {
                case "JOIN_PING":
                    opponentName = msg.name;
                    clearInterval(timerInterval); // Stop pinging
                    broadcast({ type: "JOIN_ACK", name: myName, senderId: myId });
                    startGameUi();
                    break;

                case "JOIN_ACK":
                    opponentName = msg.name;
                    clearInterval(timerInterval);
                    startGameUi();
                    break;

                case "SCORE_UPDATE":
                    oppScore = msg.score;
                    document.getElementById('opp-live-score').textContent = oppScore;
                    if(msg.questionIndex === currentQuestionIndex) {
                        opponentFinishedQuestion = true;
                        checkAdvanceCondition();
                    }
                    break;
            }
        }

        function startGameUi() {
            if (document.getElementById('quiz-screen').classList.contains('active')) return; 
            document.getElementById('my-name-label').textContent = myName + " (You)";
            document.getElementById('opp-name-label').textContent = opponentName;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrentQuestion = false;
            opponentFinishedQuestion = false;
            timeLeft = 20;
            document.getElementById('status-message').textContent = "";
            
            const currentQ = quizData[currentQuestionIndex];
            document.getElementById('question-text').textContent = `Q${currentQuestionIndex + 1}: ${currentQ.q}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); // Timeout
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 20) * 100;
            document.getElementById('timer').style.width = `${percentage}%`;
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timerInterval);
            answeredCurrentQuestion = true;

            // Freeze choices
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            const currentQ = quizData[currentQuestionIndex];
            if (selectedIndex === currentQ.correct) {
                myScore += 10;
                document.getElementById('my-live-score').textContent = myScore;
            }

            // Instantly tell the opponent your new score status for this current question
            broadcast({
                type: "SCORE_UPDATE",
                senderId: myId,
                score: myScore,
                questionIndex: currentQuestionIndex
            });

            document.getElementById('status-message').textContent = "Waiting for your opponent to answer...";
            checkAdvanceCondition();
        }

        function checkAdvanceCondition() {
            // Move forward only when BOTH players have responded or timed out on this specific question
            if (answeredCurrentQuestion && opponentFinishedQuestion) {
                currentQuestionIndex++;
                setTimeout(() => {
                    if (currentQuestionIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 1500); // Small brief delay so players see status
            }
        }

        function endGame() {
            showScreen('results-screen');
            let resultText = "";
            if (myScore > oppScore) {
                resultText = `🏆 You won against ${opponentName}! (${myScore} vs ${oppScore})`;
            } else if (oppScore > myScore) {
                resultText = `❌ ${opponentName} won! (${oppScore} vs ${myScore})`;
            } else {
                resultText = `🤝 It's a tie game! (${myScore} vs ${oppScore})`;
            }
            document.getElementById('winner-text').textContent = resultText;
        }
    </script>
</body>
</html>

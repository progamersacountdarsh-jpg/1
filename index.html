<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Launch: Force Field Duel</title>
    <!-- Stable global PeerJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #161e2e;
            --primary: #38bdf8;
            --success: #4ade80;
            --accent: #fbbf24;
            --danger: #f87171;
            --text: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #fef08a;
            text-shadow: 0 0 15px rgba(254,240,138,0.3);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--primary); font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 3px solid var(--primary); background: rgba(0,0,0,0.3);
            color: #fff; font-size: 18px; text-align: center; outline: none;
        }

        button.menu-btn {
            width: 100%; padding: 15px; background: var(--accent);
            color: #0b0f19; border: none; border-radius: 14px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 0 #b45309;
        }
        button.menu-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        button.menu-btn:active { transform: translateY(2px); box-shadow: none; }

        .divider { text-align: center; margin: 15px 0; font-weight: bold; color: #6b7280; }

        /* Scoreboard Header */
        .scoreboard {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.4); padding: 12px;
            border-radius: 16px; margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .score-box { text-align: center; flex: 1; }
        .score-box:first-child { border-right: 1px solid rgba(255,255,255,0.1); }
        .score-val { font-size: 24px; font-weight: bold; color: var(--success); }

        /* Wind/Force Warning Alert Banner */
        .alert-banner {
            display: none; background: linear-gradient(90deg, #b91c1c, #c2410c);
            color: white; text-align: center; padding: 10px;
            font-weight: bold; font-size: 16px; border-radius: 12px;
            margin-bottom: 15px; animation: flash 0.4s infinite alternate;
        }
        @keyframes flash { from { opacity: 0.7; } to { opacity: 1; } }

        /* Physics Game Canvas Container */
        .canvas-container {
            position: relative;
            width: 100%;
            background: #030712;
            border: 2px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        canvas { display: block; background: #020617; }

        /* Launch Controls Layout */
        .controls-panel {
            background: rgba(255,255,255,0.02);
            padding: 15px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .slider-row { display: flex; align-items: center; margin-bottom: 12px; gap: 10px; }
        .slider-row label { width: 80px; margin-bottom: 0; font-size: 14px; }
        input[type="range"] { flex: 1; accent-color: var(--primary); }

        .action-btn {
            width: 100%; padding: 18px; background: linear-gradient(#10b981, #059669);
            color: white; font-weight: bold; font-size: 20px; border: none;
            border-radius: 12px; cursor: pointer; box-shadow: 0 5px 0 #047857;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #047857; }
        .action-btn:disabled { background: #4b5563; box-shadow: none; cursor: not-allowed; opacity: 0.5; }

        /* Power Charging Meter */
        .power-meter-container {
            width: 100%; height: 10px; background: #1f2937;
            border-radius: 5px; margin-top: 10px; overflow: hidden;
        }
        .power-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.05s linear; }
    </style>
</head>
<body>

    <div class="container">
        <!-- WEATHER ALERT BANNER -->
        <div id="difficulty-alert" class="alert-banner">⚠️ DANGER: SOLAR WIND DRIFT INTENSIFYING! ⚠️</div>

        <!-- SCREEN 1: Entry Connection Menu -->
        <div id="setup-screen" class="screen active">
            <h1>🚀 Newton's Launch pad 🪐</h1>
            <div class="input-group">
                <label for="username">Commander Callsign:</label>
                <input type="text" id="username" placeholder="Enter pilot nickname...">
            </div>
            <hr style="opacity: 0.1; margin: 20px 0;">
            <button class="menu-btn" onclick="createRoom()">Establish New Space Room</button>
            <div class="divider">OR</div>
            <div class="input-group">
                <label for="room-code-input">Enter Navigation Room Code:</label>
                <input type="text" id="room-code-input" placeholder="e.g., launch-1234">
            </div>
            <button class="menu-btn" style="background:#3b82f6; color:white; box-shadow:0 4px 0 #1d4ed8;" onclick="joinRoom()">Join Navigation Room</button>
        </div>

        <!-- SCREEN 2: Lobby Room -->
        <div id="waiting-screen" class="screen">
            <h2>Orbit Synchronization</h2>
            <div id="code-box-display" style="background:rgba(0,0,0,0.3); padding:20px; border-radius:12px; text-align:center; border:2px dashed var(--accent); margin-bottom:20px; display:none;">
                Broadcast this frequency room code to your opponent:<br>
                <span id="display-code-id" style="font-size:32px; font-weight:bold; color:var(--primary); letter-spacing:2px;">---</span>
            </div>
            <div style="text-align:center; font-style:italic; color:#93c5fd;">Aligning orbital parameters...</div>
        </div>

        <!-- SCREEN 3: Core Gameplay Simulation Area -->
        <div id="game-screen" class="screen">
            <div class="scoreboard">
                <div class="score-box">
                    <div id="p1-label" style="font-weight:bold;">You</div>
                    <div class="score-val" id="p1-score">0/10</div>
                </div>
                <div class="score-box">
                    <div id="p2-label" style="font-weight:bold;">Opponent</div>
                    <div class="score-val" id="p2-score">0/10</div>
                </div>
            </div>

            <!-- Physics Interactive Window -->
            <div class="canvas-container">
                <canvas id="physicsCanvas" width="550" height="360"></canvas>
            </div>

            <!-- Flight Dashboard Panels -->
            <div class="controls-panel">
                <div class="slider-row">
                    <label id="angle-display">Angle: 0°</label>
                    <input type="range" id="angleRange" min="-60" max="60" value="0" oninput="updateControlsLabel()">
                </div>
                <button id="launchBtn" class="action-btn" onmousedown="startChargingEngine()" onmouseup="triggerRocketLaunch()" ontouchstart="startChargingEngine()" ontouchend="triggerRocketLaunch()">Hold to Charge Engine</button>
                <div class="power-meter-container">
                    <div id="powerBar" class="power-bar"></div>
                </div>
            </div>
        </div>

        <!-- SCREEN 4: Match Summary Arena -->
        <div id="results-screen" class="screen">
            <h1>🏆 Simulation Concluded 🏆</h1>
            <div class="scoreboard" style="background:rgba(255,255,255,0.03); margin:25px 0; padding:20px;">
                <div class="score-box">
                    <div id="r-p1-name" style="font-weight:bold; font-size:18px;">You</div>
                    <div class="score-val" id="r-p1-score" style="font-size:46px;">0</div>
                </div>
                <div class="score-box">
                    <div id="r-p2-name" style="font-weight:bold; font-size:18px;">Opponent</div>
                    <div class="score-val" id="r-p2-score" style="font-size:46px;">0</div>
                </div>
            </div>
            <h2 id="end-winner-banner" style="color:#fef08a; text-align:center; min-height:45px; white-space:pre-wrap;"></h2>
            <button class="menu-btn" onclick="location.reload()" style="background:var(--success); box-shadow:0 4px 0 #15803d; margin-top:15px;">Return to Main Station</button>
        </div>
    </div>

    <script>
        let peer = null, connection = null;
        let myName = "", oppName = "Opponent";
        let rocketsDocked = 0;
        const totalToWin = 10;
        let oppDockedCount = 0;
        let myFinished = false, oppFinished = false;

        // Physics Engine Global Variables
        let canvas, ctx;
        let animationFrameId;
        
        let rocket = { x: 275, y: 330, vx: 0, vy: 0, active: false, radius: 6 };
        let spaceStation = { x: 275, y: 30, radius: 18, direction: 1, speed: 2 };
        let gravityWell = { x: 275, y: 180, mass: 150, radius: 22 }; // Gravitational obstacle
        
        let engineCharge = 0;
        let chargingInterval;
        let isCharging = false;
        let solarWindX = 0; // Adaptive variable force factor

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function updateControlsLabel() {
            const val = document.getElementById('angleRange').value;
            document.getElementById('angle-display').textContent = `Angle: ${val}°`;
        }

        // Room Networking Initializations
        function createRoom() {
            myName = document.getElementById('username').value.trim() || "Commander Host";
            showScreen('waiting-screen');
            const code = Math.floor(1000 + Math.random() * 9000);
            const fullId = `launch-${code}`;

            peer = new Peer(fullId);
            peer.on('open', (id) => {
                document.getElementById('code-box-display').style.display = 'block';
                document.getElementById('display-code-id').textContent = id;
            });
            peer.on('connection', (conn) => {
                connection = conn;
                bindNetworkEvents();
            });
        }

        function joinRoom() {
            myName = document.getElementById('username').value.trim() || "Pilot Guest";
            const code = document.getElementById('room-code-input').value.trim();
            if(!code) return alert("Please specify room code!");

            showScreen('waiting-screen');
            peer = new Peer();
            peer.on('open', () => {
                connection = peer.connect(code);
                bindNetworkEvents();
            });
        }

        function bindNetworkEvents() {
            connection.on('open', () => {
                connection.send({ type: 'HANDSHAKE', name: myName });
            });
            connection.on('data', (data) => {
                if(data.type === 'HANDSHAKE') {
                    oppName = data.name;
                    launchGameSimulation();
                } else if(data.type === 'UPDATE') {
                    oppDockedCount = data.count;
                    document.getElementById('p2-score').textContent = `${oppDockedCount}/${totalToWin}`;
                    document.getElementById('r-p2-score').textContent = oppDockedCount;
                    if(data.finished) oppFinished = true;
                    evaluateMatchEndCondition();
                } else if(data.type === 'WIND_ALERT') {
                    triggerSolarAlert();
                }
            });
        }

        function launchGameSimulation() {
            document.getElementById('p1-label').textContent = myName;
            document.getElementById('r-p1-name').textContent = myName;
            document.getElementById('p2-label').textContent = oppName;
            document.getElementById('r-p2-name').textContent = oppName;
            showScreen('game-screen');
            
            canvas = document.getElementById('physicsCanvas');
            ctx = canvas.getContext('2d');
            
            resetRocketState();
            startPhysicsLoop();
        }

        // Engine charging mechanisms
        function startChargingEngine() {
            if(rocket.active || isCharging) return;
            isCharging = true;
            engineCharge = 0;
            document.getElementById('powerBar').style.width = '0%';
            
            chargingInterval = setInterval(() => {
                if(engineCharge < 100) {
                    engineCharge += 4;
                    document.getElementById('powerBar').style.width = `${engineCharge}%`;
                }
            }, 30);
        }

        function triggerRocketLaunch() {
            if(!isCharging) return;
            clearInterval(chargingInterval);
            isCharging = false;

            const angleDeg = parseFloat(document.getElementById('angleRange').value);
            const angleRad = (angleDeg - 90) * (Math.PI / 180); // Calculate standard physics vectors
            
            // Convert engine power parameter to velocity components
            const totalVelocity = (engineCharge / 100) * 9 + 3; // range: 3 to 12
            
            rocket.vx = Math.cos(angleRad) * totalVelocity;
            rocket.vy = Math.sin(angleRad) * totalVelocity;
            rocket.active = true;
            
            document.getElementById('launchBtn').disabled = true;
        }

        function resetRocketState() {
            rocket.x = 275;
            rocket.y = 330;
            rocket.vx = 0;
            rocket.vy = 0;
            rocket.active = false;
            document.getElementById('powerBar').style.width = '0%';
            document.getElementById('launchBtn').disabled = false;

            // Adaptive difficulty escalations based on your current score tier (Every 2 rounds)
            const difficultyTier = Math.floor(rocketsDocked / 2);
            spaceStation.speed = 2 + difficultyTier * 1.2; 
            gravityWell.mass = 150 + difficultyTier * 60; // Pulls harder
            
            // Introduce Unbalanced Horizontal Wind Forces starting past round 4
            if(rocketsDocked >= 4) {
                solarWindX = (Math.random() > 0.5 ? 1 : -1) * (difficultyTier * 0.04);
            } else {
                solarWindX = 0;
            }
        }

        function triggerSolarAlert() {
            const banner = document.getElementById('difficulty-alert');
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 2500);
        }

        // Core Physics Simulation loop runs at 60fps
        function startPhysicsLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Move Space Station Target (Horizontal Loop boundary bounces)
            spaceStation.x += spaceStation.speed * spaceStation.direction;
            if(spaceStation.x <= 40 || spaceStation.x >= canvas.width - 40) {
                spaceStation.direction *= -1;
            }

            // 2. Vector physics math handling rocket trajectory
            if(rocket.active) {
                // Apply Unbalanced Solar Winds drift forces
                rocket.vx += solarWindX;

                // Gravitational force formulas: F = G*(m1*m2)/r^2
                let dx = gravityWell.x - rocket.x;
                let dy = gravityWell.y - rocket.y;
                let distance = Math.sqrt(dx*dx + dy*dy);

                if(distance > 5) {
                    let forceMultiplier = gravityWell.mass / (distance * distance);
                    rocket.vx += (dx / distance) * forceMultiplier;
                    rocket.vy += (dy / distance) * forceMultiplier;
                }

                // Update position coordinate states
                rocket.x += rocket.vx;
                rocket.y += rocket.vy;

                // Collision detection checking: Did it crash into the Gravity Well obstacle?
                let crashDx = gravityWell.x - rocket.x;
                let crashDy = gravityWell.y - rocket.y;
                let crashDist = Math.sqrt(crashDx*crashDx + crashDy*crashDy);
                
                if(crashDist < (gravityWell.radius + rocket.radius)) {
                    resetRocketState();
                }

                // Collision detection checking: Did it hit boundary walls?
                if(rocket.x < 0 || rocket.x > canvas.width || rocket.y < 0 || rocket.y > canvas.height) {
                    resetRocketState();
                }

                // Success validation: Did it reach and collide with the Space Station?
                let targetDx = spaceStation.x - rocket.x;
                let targetDy = spaceStation.y - rocket.y;
                let targetDist = Math.sqrt(targetDx*targetDx + targetDy*targetDy);

                if(targetDist < (spaceStation.radius + rocket.radius)) {
                    processSuccessfulDock();
                }
            }

            // Render Frame elements
            drawSimulationElements();

            animationFrameId = requestAnimationFrame(startPhysicsLoop);
        }

        function drawSimulationElements() {
            // Draw Solar Winds visual cues if active
            if(Math.abs(solarWindX) > 0) {
                ctx.fillStyle = "rgba(56, 189, 248, 0.06)";
                for(let i = 0; i < 5; i++) {
                    ctx.fillRect((Date.now()/5 + i*120) % canvas.width, 0, 4, canvas.height);
                }
            }

            // Draw Space Station Dock Target
            ctx.beginPath();
            ctx.arc(spaceStation.x, spaceStation.y, spaceStation.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#a855f7";
            ctx.strokeStyle = "#c084fc";
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();
            // Core light indicator
            ctx.beginPath();
            ctx.arc(spaceStation.x, spaceStation.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = varColorText();
            ctx.fill();

            // Draw Gravitational Obstacle Asteroid / Black Hole
            ctx.beginPath();
            ctx.arc(gravityWell.x, gravityWell.y, gravityWell.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#f43f5e";
            ctx.shadowColor = "#f43f5e";
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0; // reset glow shadow state

            // Draw Launchpad Base Line
            ctx.fillStyle = "#1e2937";
            ctx.fillRect(225, 345, 100, 15);

            // Draw Rocket Projectile
            ctx.beginPath();
            ctx.arc(rocket.x, rocket.y, rocket.radius, 0, Math.PI * 2);
            ctx.fillStyle = rocket.active ? varColorSuccess() : varColorPrimary();
            ctx.fill();
        }

        function varColorText() { return "#ffffff"; }
        function varColorPrimary() { return "#38bdf8"; }
        function varColorSuccess() { return "#4ade80"; }

        function processSuccessfulDock() {
            rocketsDocked++;
            document.getElementById('p1-score').textContent = `${rocketsDocked}/${totalToWin}`;
            document.getElementById('r-p1-score').textContent = rocketsDocked;
            
            myFinished = (rocketsDocked >= totalToWin);

            // Sync scores immediately across direct connection nodes
            connection.send({
                type: 'UPDATE',
                count: rocketsDocked,
                finished: myFinished
            });

            if(rocketsDocked > 0 && rocketsDocked % 2 === 0 && !myFinished) {
                triggerSolarAlert();
                connection.send({ type: 'WIND_ALERT' });
            }

            resetRocketState();

            if(myFinished) {
                cancelAnimationFrame(animationFrameId);
                showScreen('results-screen');
                evaluateMatchEndCondition();
            }
        }

        function evaluateMatchEndCondition() {
            const label = document.getElementById('end-winner-banner');
            
            if(myFinished && oppFinished) {
                if(rocketsDocked > oppDockedCount) {
                    label.innerText = `👑 Simulation Won!\nYou successfully docked your fleet faster than ${oppName}!`;
                    label.style.color = "#4ade80";
                } else if(oppDockedCount > rocketsDocked) {
                    label.innerText = `🎉 ${oppName} Wins!\nYour fleet was pulled off course by the forces of gravity!`;
                    label.style.color = "#f87171";
                } else {
                    label.innerText = `🤝 Equal Trajectories!\nBoth pilots hit perfect orbital ties!`;
                    label.style.color = "#fef08a";
                }
            } else if(myFinished && !oppFinished) {
                label.innerText = `All your rockets are docked!\nYour Score: 10/10 | ${oppName} Score: ${oppDockedCount}/10\n(Standby, your opponent is fighting gravitational pull...)`;
                label.style.color = "#fbbf24";
            }
        }
    </script>
</body>
</html>

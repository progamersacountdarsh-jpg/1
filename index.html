<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Multiplayer Quiz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #0f0c1b;
            --card-bg: #1c1432;
            --text: #ffffff;
            --success: #00b894;
            --error: #d63031;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg), #2d142c);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--secondary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-weight: bold;
        }

        /* Room Display Status */
        .room-display {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border: 1px dashed var(--secondary);
        }

        .room-code-highlight {
            font-size: 24px;
            font-weight: bold;
            color: #00b894;
            letter-spacing: 2px;
        }

        /* Live Scoreboard Header */
        .live-scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-box:first-child {
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .score-val {
            font-size: 24px;
            font-weight: bold;
            color: var(--success);
        }

        /* Timer components */
        .timer-container {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background: var(--error);
            transition: width 1s linear;
        }

        /* Quiz UI */
        .question-text {
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.2);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .waiting-msg {
            text-align: center;
            font-style: italic;
            color: var(--secondary);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen" class="screen active">
            <h1>Multiplayer Quiz</h1>
            <div class="input-group">
                <label for="username">Your Name:</label>
                <input type="text" id="username" placeholder="Enter name...">
            </div>
            
            <hr style="opacity: 0.1; margin: 25px 0;">

            <button onclick="initiateHost()">Option A: Host a New Game Room</button>
            
            <div class="divider">OR</div>
            
            <div class="input-group">
                <label for="join-room-id">Enter Friend's Room Code:</label>
                <input type="text" id="join-room-id" placeholder="e.g., quiz-5732">
            </div>
            <button style="background: #2d142c; border: 1px solid var(--primary);" onclick="connectToHost()">Option B: Join Existing Room</button>
        </div>

        <div id="waiting-screen" class="screen">
            <h2>Lobby Status</h2>
            <div id="room-info-display" class="room-display" style="display:none;">
                Share this Room Code with your friend:<br>
                <span id="generated-code" class="room-code-highlight">---</span>
            </div>
            <div class="waiting-msg" id="waiting-status">Initializing networking...</div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="live-scoreboard">
                <div class="score-box">
                    <div id="my-name-label">You</div>
                    <div class="score-val" id="my-live-score">0</div>
                </div>
                <div class="score-box">
                    <div id="opp-name-label">Opponent</div>
                    <div class="score-val" id="opp-live-score">0</div>
                </div>
            </div>

            <div class="timer-container">
                <div id="timer" class="timer-bar"></div>
            </div>

            <div class="question-text" id="question-text">Loading question...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="waiting-msg" id="status-message"></div>
        </div>

        <div id="results-screen" class="screen">
            <h1>Game Over!</h1>
            <h2 id="winner-text" style="color: var(--success); font-size: 28px; text-align: center; margin: 20px 0;"></h2>
            <button onclick="location.reload()">Play Another Match</button>
        </div>
    </div>

    <script>
        // Shared questions pool
        const quizData = [
            { q: "What does HTML stand for?", options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyperlinks and Text Markup Language"], correct: 0 },
            { q: "Which language provides logic and interactivity to a web page?", options: ["CSS", "HTML", "JavaScript"], correct: 2 },
            { q: "Which HTML element is used to insert a line break?", options: ["<lb>", "<br>", "<break>"], correct: 1 },
            { q: "Which CSS property controls text size?", options: ["text-style", "text-size", "font-size"], correct: 2 }
        ];

        let peer = null;
        let connection = null;
        let myName = "";
        let opponentName = "Opponent";
        
        let currentQuestionIndex = 0;
        let myScore = 0;
        let oppScore = 0;
        
        let timeLeft = 20;
        let timerInterval;
        let answeredCurrentQuestion = false;
        let opponentFinishedQuestion = false;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // ==========================================
        // OPTION A: ACT AS HOST
        // ==========================================
        function initiateHost() {
            myName = document.getElementById('username').value.trim() || "Host Player";
            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Generating room code...";

            // Create a random readable 4-digit room code
            const randomCode = Math.floor(1000 + Math.random() * 9000);
            const hostRoomId = `quiz-${randomCode}`;

            peer = new Peer(hostRoomId);

            peer.on('open', (id) => {
                document.getElementById('room-info-display').style.display = 'block';
                document.getElementById('generated-code').textContent = id;
                document.getElementById('waiting-status').textContent = "Waiting for opponent to connect...";
            });

            peer.on('connection', (conn) => {
                connection = conn;
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Error setting up host room: " + err.type);
                location.reload();
            });
        }

        // ==========================================
        // OPTION B: ACT AS JOINER
        // ==========================================
        function connectToHost() {
            myName = document.getElementById('username').value.trim() || "Guest Player";
            const targetRoomId = document.getElementById('join-room-id').value.trim();

            if (!targetRoomId) {
                alert("Please enter your friend's room code first!");
                return;
            }

            showScreen('waiting-screen');
            document.getElementById('waiting-status').textContent = "Locating room code over peer network...";

            peer = new Peer(); // Auto-assign random ID to self

            peer.on('open', () => {
                connection = peer.connect(targetRoomId);
                setupConnectionDataListeners();
            });

            peer.on('error', (err) => {
                alert("Could not connect to that room code. Check the spelling or if the room is active.");
                location.reload();
            });
        }

        // ==========================================
        // DATA CHANNEL & GAME SYNC LOGIC
        // ==========================================
        function setupConnectionDataListeners() {
            // Once peer connection successfully binds open
            connection.on('open', () => {
                // Instantly exchange names
                connection.send({ type: 'HANDSHAKE', name: myName });
            });

            // Monitor continuous score updates and messages
            connection.on('data', (data) => {
                if (data.type === 'HANDSHAKE') {
                    opponentName = data.name;
                    startGameUi();
                } else if (data.type === 'SCORE_UPDATE') {
                    oppScore = data.score;
                    document.getElementById('opp-live-score').textContent = oppScore;
                    if (data.questionIndex === currentQuestionIndex) {
                        opponentFinishedQuestion = true;
                        checkAdvanceCondition();
                    }
                }
            });

            connection.on('close', () => {
                alert("Opponent left the match.");
                location.reload();
            });
        }

        function startGameUi() {
            document.getElementById('my-name-label').textContent = myName + " (You)";
            document.getElementById('opp-name-label').textContent = opponentName;
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrentQuestion = false;
            opponentFinishedQuestion = false;
            timeLeft = 20;
            document.getElementById('status-message').textContent = "";
            
            const currentQ = quizData[currentQuestionIndex];
            document.getElementById('question-text').textContent = `Q${currentQuestionIndex + 1}: ${currentQ.q}`;

            const container = document.getElementById('options-container');
            container.innerHTML = "";

            currentQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => submitAnswer(idx);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer(-1); // Automatically force skip due to timeout
                }
            }, 1000);
        }

        function updateTimerBar() {
            const percentage = (timeLeft / 20) * 100;
            document.getElementById('timer').style.width = `${percentage}%`;
        }

        function submitAnswer(selectedIndex) {
            clearInterval(timerInterval);
            answeredCurrentQuestion = true;

            // Lock out interactive answer choices
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            const currentQ = quizData[currentQuestionIndex];
            if (selectedIndex === currentQ.correct) {
                myScore += 10;
                document.getElementById('my-live-score').textContent = myScore;
            }

            // Sync score across the direct P2P pipeline
            connection.send({
                type: 'SCORE_UPDATE',
                score: myScore,
                questionIndex: currentQuestionIndex
            });

            document.getElementById('status-message').textContent = "Waiting for your opponent to answer...";
            checkAdvanceCondition();
        }

        function checkAdvanceCondition() {
            // Shift to next frame when both parties settle values
            if (answeredCurrentQuestion && opponentFinishedQuestion) {
                currentQuestionIndex++;
                setTimeout(() => {
                    if (currentQuestionIndex < quizData.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 1200); 
            }
        }

        function endGame() {
            showScreen('results-screen');
            let resultText = "";
            if (myScore > oppScore) {
                resultText = `🏆 You won against ${opponentName}!\n(${myScore} vs ${oppScore})`;
            } else if (oppScore > myScore) {
                resultText = `❌ ${opponentName} won!\n(${oppScore} vs ${myScore})`;
            } else {
                resultText = `🤝 It's a tie game!\n(${myScore} vs ${oppScore})`;
            }
            document.getElementById('winner-text').innerText = resultText;
        }
    </script>
</body>
</html>
